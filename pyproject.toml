[project]
name = "lucid-det"
version = "0.1.0"
description = "Modular object detection framework (YOLOv1, YOLOX, RTMDet)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy",
  "opencv-python",
  "pillow",
  "pycocotools",
  "faster-coco-eval",
  "tqdm",
  "matplotlib",
  "albumentations",
  "mlflow",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (unused imports, undefined variables)
  "I",   # isort (import sorting)
]
ignore = [
  "E501",  # Line too long (handled automatically by the formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tools/*" = ["E402"]
"training_scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

