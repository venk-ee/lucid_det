[project]
name = "lucid-det"
version = "0.1.0"
description = "Pure PyTorch modular object detection framework (YOLOv1, YOLOX, RTMDet)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy",
  "opencv-python",
  "pillow",
  "pycocotools",
  "faster-coco-eval",
  "tqdm",
  "matplotlib",
  "albumentations",
  "mlflow",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
